name: CI

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      full-matrix:
        description: 'Also run Android, iOS, and macOS integration tests'
        type: boolean
        default: true
      include-windows:
        description: 'Also run Windows integration tests'
        type: boolean
        default: false
      integration-test-working-directory:
        description: 'Directory containing the integration test Flutter app'
        type: string
        default: example
      integration-test-target:
        description: 'Integration test file relative to the working directory'
        type: string
        default: integration_test/app_test.dart
      integration-test-driver:
        description: 'Web integration test driver file'
        type: string
        default: test_driver/integration_test.dart
  workflow_call:
    inputs:
      full-matrix:
        description: 'Also run Android, iOS, and macOS integration tests'
        type: boolean
        default: false
      include-windows:
        description: 'Also run Windows integration tests'
        type: boolean
        default: false
      integration-test-working-directory:
        description: 'Directory containing the integration test Flutter app'
        type: string
        default: example
      integration-test-target:
        description: 'Integration test file relative to the working directory'
        type: string
        default: integration_test/app_test.dart
      integration-test-driver:
        description: 'Web integration test driver file'
        type: string
        default: test_driver/integration_test.dart

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Detect Integration Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@15192bc058cc28a13dbf6cde61f19e18988b7af6 # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            integration:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  test:
    name: Test & Analyze
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/validate-package
        with:
          run-publish-dry-run: ${{ github.event_name == 'workflow_dispatch' }}
          run-pana: ${{ github.event_name == 'workflow_dispatch' }}

  integration-web:
    name: Integration Tests (Web Chrome)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-web
        with:
          integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
          integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}
          integration-test-driver: ${{ inputs.integration-test-driver || 'test_driver/integration_test.dart' }}

  integration-linux:
    name: Integration Tests (Linux)
    needs: changes
    if: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-linux
        with:
          integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
          integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}

  integration-android:
    name: Integration Tests (Android Emulator)
    needs: changes
    if: ${{ inputs.full-matrix }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-android
        with:
          integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
          integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}

  integration-ios:
    name: Integration Tests (iOS Simulator)
    needs: changes
    if: ${{ inputs.full-matrix }}
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-ios
        with:
          integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
          integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}

  integration-desktop:
    name: Integration Tests (${{ matrix.platform }})
    needs: changes
    if: ${{ inputs.full-matrix || inputs.include-windows }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.full-matrix && inputs.include-windows && '["macos","windows"]' || inputs.full-matrix && '["macos"]' || '["windows"]') }}
    runs-on: ${{ format('{0}-latest', matrix.platform) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Tkko/Flutter_Pinput
          ref: ${{ job.workflow_sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-desktop
        with:
          platform: ${{ matrix.platform }}
          integration-test-working-directory: ${{ inputs.integration-test-working-directory || 'example' }}
          integration-test-target: ${{ inputs.integration-test-target || 'integration_test/app_test.dart' }}

  required:
    name: CI required
    needs: [changes, test, integration-web, integration-linux, integration-android, integration-ios, integration-desktop]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check required jobs
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_TEST: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
          RUN_WEB_LINUX: ${{ github.event_name != 'pull_request' || needs.changes.outputs.integration == 'true' }}
          RUN_MOBILE: ${{ inputs.full-matrix }}
          RUN_DESKTOP: ${{ inputs.full-matrix || inputs.include-windows }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys

          expected = {"changes": "success"}
          for jobs, toggle in [
              (["test"], "RUN_TEST"),
              (["integration-web", "integration-linux"], "RUN_WEB_LINUX"),
              (["integration-android", "integration-ios"], "RUN_MOBILE"),
              (["integration-desktop"], "RUN_DESKTOP"),
          ]:
              expected.update(dict.fromkeys(jobs, "success" if os.environ[toggle] == "true" else "skipped"))
          results = json.loads(os.environ["JOB_RESULTS"])
          failed = False
          for job, status in expected.items():
              actual = results[job]["result"]
              if actual != status:
                  print(f"::error::{job}: expected {status}, got {actual}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
