name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-test.yml
    with:
      run-integration-tests: ${{ github.base_ref == 'master' || github.ref == 'refs/heads/master' }}
