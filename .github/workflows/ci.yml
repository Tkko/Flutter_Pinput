name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Comma-separated integration test platforms: web, linux, android, ios, macos, windows'
        type: string
        default: web,linux,android,ios,macos

permissions:
  contents: read

jobs:
  ci:
    permissions:
      contents: read
    uses: Tkko/better-actions/.github/workflows/ci.yml@main
    with:
      platforms: ${{ inputs.platforms || 'web' }}
