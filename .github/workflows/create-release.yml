name: Create Release & Tag

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v7.0.1). Leave empty to use version from pubspec.yaml'
        required: false
        type: string
      dry_run:
        description: 'Dry run (validate tests and pubspec without creating tag/release)'
        required: false
        default: false
        type: boolean
      include-windows:
        description: 'Also validate Windows before creating the release'
        required: false
        default: false
        type: boolean

concurrency:
  group: create-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve Release Commit & Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - id: metadata
        uses: ./.github/workflow-actions/.github/actions/release-metadata
        with:
          tag-name: ${{ inputs.tag_name }}

  validate:
    name: Validate Release Commit
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/validate-package
        with:
          run-publish-dry-run: 'true'
          run-pana: 'true'

  integration-web:
    name: Integration Tests (Web Chrome)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-web

  integration-linux:
    name: Integration Tests (Linux)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-linux

  integration-android:
    name: Integration Tests (Android Emulator)
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-android
        with:
          cleanup-shared-checkout: 'true'

  integration-ios:
    name: Integration Tests (iOS Simulator)
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-ios

  integration-desktop:
    name: Integration Tests (${{ matrix.platform }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.include-windows && '["macos","windows"]' || '["macos"]') }}
    runs-on: ${{ format('{0}-latest', matrix.platform) }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/integration-desktop
        with:
          platform: ${{ matrix.platform }}

  release:
    name: Create Release & Tag
    needs: [prepare, validate, integration-web, integration-linux, integration-android, integration-ios, integration-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - name: Checkout shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: .github/workflow-actions
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/workflow-actions/.github/actions/create-release
        with:
          release-tag: ${{ needs.prepare.outputs.tag }}
          release-sha: ${{ needs.prepare.outputs.sha }}
          dry_run: ${{ inputs.dry_run }}
