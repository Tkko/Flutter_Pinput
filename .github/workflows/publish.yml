name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      skip_validation:
        description: 'Skip Test & Validate (set by Create Release & Tag, which already validated this commit)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    permissions:
      contents: read
      id-token: write
    uses: Tkko/better-actions/.github/workflows/publish.yml@main
    with:
      skip-validation: ${{ inputs.skip_validation == true }}
