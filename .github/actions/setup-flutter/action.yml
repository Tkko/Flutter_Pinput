name: Set up Flutter package
description: Install the Flutter SDK with caching and resolve package dependencies

inputs:
  flutter-channel:
    description: Flutter SDK channel
    required: false
    default: stable
  flutter-version:
    description: Flutter SDK version; empty uses channel latest
    required: false
    default: '3.47.8'
  working-directory:
    description: Package or app directory in the calling repository
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Set up Flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Install dependencies
      shell: bash
      run: flutter pub get
      working-directory: ${{ inputs.working-directory }}
