name: release metadata
description: Execute release metadata steps
inputs:
  existing-tag:
    description: Validate a publishing event on an existing tag instead of preparing
      a new tag
    required: false
    default: 'false'
  working-directory:
    description: Directory containing pubspec.yaml
    required: false
    default: "."
  tag-name:
    description: Requested new tag; empty derives it from pubspec.yaml
    required: false
    default: ''
  tag-prefix:
    description: Prefix before the package version in release tags
    required: false
    default: v
outputs:
  sha:
    description: Action result
    value: "${{ steps.metadata.outputs.sha }}"
  tag:
    description: Action result
    value: "${{ steps.metadata.outputs.tag }}"
runs:
  using: composite
  steps:
  - name: Require a tag publishing event
    if: "${{ inputs.existing-tag == 'true' }}"
    env:
      REF_TYPE: "${{ github.ref_type }}"
      EVENT_NAME: "${{ github.event_name }}"
    run: |
      if [ "$REF_TYPE" != 'tag' ] || { [ "$EVENT_NAME" != 'push' ] && [ "$EVENT_NAME" != 'workflow_dispatch' ]; }; then
        echo "::error::Publishing requires a push or workflow_dispatch event on a version tag."
        exit 1
      fi
    shell: bash
  - name: Validate version and resolve metadata
    id: metadata
    env:
      WORKING_DIR: "${{ inputs.working-directory }}"
      INPUT_TAG: "${{ inputs.tag-name }}"
      TAG_PREFIX: "${{ inputs.tag-prefix }}"
      EXISTING_TAG: "${{ inputs.existing-tag }}"
      EVENT_TAG: "${{ github.ref_name }}"
    run: |
      VERSION=$(ruby -ryaml -e 'puts YAML.load_file(File.join(ENV.fetch("WORKING_DIR"), "pubspec.yaml")).fetch("version")')
      export VERSION
      python3 - <<'PY'
      import os
      import re
      import subprocess
      import sys

      def fail(message):
          print(f"::error::{message}")
          sys.exit(1)

      version = os.environ["VERSION"]
      identifier = r"(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)"
      semver = rf"(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-{identifier}(?:\.{identifier})*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?"
      if not re.fullmatch(semver, version):
          fail("pubspec.yaml must contain a valid semantic version.")
      expected_tag = os.environ["TAG_PREFIX"] + version
      existing = os.environ["EXISTING_TAG"] == "true"
      tag = os.environ["EVENT_TAG"] if existing else os.environ["INPUT_TAG"] or expected_tag
      if tag != expected_tag:
          fail(f"Tag {tag!r} must match pubspec.yaml: {expected_tag!r}.")
      if subprocess.run(["git", "check-ref-format", "refs/tags/" + tag]).returncode:
          fail("Invalid release tag.")
      sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
      tag_result = subprocess.run(
          ["git", "show-ref", "--verify", "--quiet", "refs/tags/" + tag]
      ).returncode
      if tag_result not in (0, 1):
          fail("Unable to inspect release tags.")
      tag_exists = tag_result == 0
      if not existing and tag_exists:
          fail(f"Tag {tag!r} already exists. Bump the package version before releasing.")
      if existing:
          if not tag_exists:
              fail("Publishing tag does not exist.")
          tag_sha = subprocess.check_output(
              ["git", "rev-parse", "refs/tags/" + tag + "^{commit}"], text=True
          ).strip()
          if tag_sha != sha:
              fail("Checked-out commit does not match the publishing tag.")
      with open(os.environ["GITHUB_OUTPUT"], "a") as output:
          output.write(f"sha={sha}\ntag={tag}\n")
      print(f"Validated {tag} at {sha}")
      PY
    shell: bash
