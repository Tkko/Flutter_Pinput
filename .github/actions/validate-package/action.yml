name: validate package
description: Execute validate package steps
inputs:
  flutter-channel:
    description: Flutter SDK channel to use (stable, beta, master)
    required: false
    default: stable
  flutter-version:
    description: Specific Flutter SDK version (optional, empty uses channel latest)
    required: false
    default: 3.47.8
  working-directory:
    description: Working directory of the primary Flutter package
    required: false
    default: "."
  run-format:
    description: Whether to verify code formatting with dart format
    required: false
    default: 'true'
  run-analyze:
    description: Whether to run flutter analyze
    required: false
    default: 'true'
  run-test:
    description: Whether to run flutter test unit/widget tests
    required: false
    default: 'true'
  run-publish-dry-run:
    description: Whether to run dart pub publish --dry-run
    required: false
    default: 'false'
  run-pana:
    description: Whether to verify pana score
    required: false
    default: 'false'
runs:
  using: composite
  steps:
  - name: Set up Flutter package
    uses: "./.github/workflow-actions/.github/actions/setup-flutter"
    with:
      flutter-channel: "${{ inputs.flutter-channel }}"
      flutter-version: "${{ inputs.flutter-version }}"
      working-directory: "${{ inputs.working-directory }}"
  - name: Remove shared action checkout
    shell: bash
    run: rm -r -- .github/workflow-actions
  - name: Verify formatting
    if: "${{ inputs.run-format == 'true' }}"
    run: dart format --output=none --set-exit-if-changed .
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Analyze code
    if: "${{ inputs.run-analyze == 'true' }}"
    run: flutter analyze
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Run tests
    if: "${{ inputs.run-test == 'true' }}"
    run: flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/package-tests.log"
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Pub publish dry-run
    if: "${{ inputs.run-publish-dry-run == 'true' }}"
    run: flutter pub publish --dry-run
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Install webp (for pana screenshot validation)
    if: "${{ inputs.run-pana == 'true' }}"
    run: sudo apt-get update && sudo apt-get install -y webp
    shell: bash
  - name: Verify all points from pana
    if: "${{ inputs.run-pana == 'true' }}"
    run: |
      flutter pub global activate pana
      flutter packages pub global run pana --exit-code-threshold 0 .
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Upload failure diagnostics
    if: "${{ failure() }}"
    uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
    with:
      name: package-test-diagnostics
      path: "${{ runner.temp }}/package-tests.log"
      retention-days: 7
      if-no-files-found: warn
