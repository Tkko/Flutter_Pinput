name: publish package
description: Execute publish package steps
inputs:
  flutter-channel:
    description: Flutter SDK channel to use
    required: false
    default: stable
  flutter-version:
    description: Specific Flutter SDK version; empty uses channel latest
    required: false
    default: 3.47.8
  working-directory:
    description: Directory containing the package
    required: false
    default: "."
runs:
  using: composite
  steps:
  - name: Configure pub.dev OIDC authentication
    uses: dart-lang/setup-dart@7654d458321ee25acccccfdb86cd48bd95768ff1
    with:
      sdk: 3.13.7
  - name: Set up Flutter package
    uses: "./.github/workflow-actions/.github/actions/setup-flutter"
    with:
      flutter-channel: "${{ inputs.flutter-channel }}"
      flutter-version: "${{ inputs.flutter-version }}"
      working-directory: "${{ inputs.working-directory }}"
  - name: Remove shared action checkout
    shell: bash
    run: rm -r -- .github/workflow-actions
  - name: Publish dry run
    run: flutter pub publish --dry-run
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
  - name: Publish to pub.dev
    run: flutter pub publish --force
    working-directory: "${{ inputs.working-directory }}"
    shell: bash
