include: ../analysis_options.yaml

analyzer:
  errors:
    missing_required_param: warning
    missing_return: warning
    todo: ignore
  exclude:
    - flutter/**
    - lib/api/*.dart
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-raw-types: true

linter:
  rules:
    public_member_api_docs: false
    library_private_types_in_public_api: false